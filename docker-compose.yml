# La clave `version:` está obsoleta en Compose v2+ y se omite a propósito.
name: si-be-boilerplate

services:
  postgres:
    image: postgres:18-alpine
    container_name: si_be_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Sin default: una base con contraseña "postgres" es una brecha
      # inmediata si el puerto llegara a quedar expuesto. Tiene que venir del
      # .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio, copiá .env.example a .env y cambialo}
      POSTGRES_DB: ${POSTGRES_DB:-si_be_boilerplate}
    ports:
      # Solo en loopback: la base NO debe quedar expuesta a Internet.
      # Se publica igual para poder correr `prisma migrate` y la API en el host.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    # Impide escalar privilegios con binarios setuid dentro del contenedor.
    security_opt:
      - no-new-privileges:true
    volumes:
      # Postgres 18+ guarda los datos en un subdirectorio con el nombre de la
      # major version, así que el mount va en /var/lib/postgresql y NO en
      # /var/lib/postgresql/data (que era lo correcto hasta la 17).
      - pgdata:/var/lib/postgresql
    healthcheck:
      # `api` espera a que este healthcheck pase antes de arrancar, para que
      # las migraciones no fallen contra un Postgres que todavía inicializa.
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-si_be_boilerplate}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: si_be_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8000
      # Dentro de la red de Compose el host de la base es el nombre del
      # servicio (`postgres`), no `localhost`.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio, copiá .env.example a .env y cambialo}@postgres:5432/${POSTGRES_DB:-si_be_boilerplate}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio, copiá .env.example a .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN_DAYS: ${REFRESH_TOKEN_EXPIRES_IN_DAYS:-7}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
    ports:
      - '${PORT:-8000}:8000'
    # Impide escalar privilegios con binarios setuid dentro del contenedor.
    security_opt:
      - no-new-privileges:true
    # Aplica las migraciones pendientes antes de levantar el servidor.
    command: sh -c "npx prisma migrate deploy && node dist/main.js"

volumes:
  pgdata:
